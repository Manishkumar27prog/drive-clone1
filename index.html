
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Clone</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">

  <script src="src/api.js" defer></script>
  <script src="script.js" defer></script>
  <script src="src/auth.js" defer></script>
</head>
<body>

  <!-- Authentication -->
  <section id="auth-section" class="auth-section">
    <div class="auth-card">
      <h1>Drive Clone</h1>
      <p id="auth-description">Sign in to access your files.</p>

      <form id="login-form">
        <input
          type="email"
          id="login-email"
          placeholder="Email address"
          required
        >
        <input
          type="password"
          id="login-password"
          placeholder="Password"
          required
        >
        <button type="submit">Login</button>
      </form>

      <form id="register-form" hidden>
        <input
          type="text"
          id="register-name"
          placeholder="Full name"
          required
        >
        <input
          type="email"
          id="register-email"
          placeholder="Email address"
          required
        >
        <input
          type="password"
          id="register-password"
          placeholder="Password (minimum 8 characters)"
          minlength="8"
          required
        >
        <button type="submit">Create account</button>
      </form>

      <p id="auth-message" role="alert"></p>

      <button type="button" id="toggle-auth">
        Create a new account
      </button>
    </div>
  </section>

  <!-- Main Drive Application -->
  <div class="app" id="drive-app" hidden>

    <header class="topbar">
      <div class="brand">Drive</div>

      <input
        type="search"
        id="search-input"
        placeholder="Search in Drive"
        aria-label="Search files"
      >

      <select id="sort-select">
        <option value="newest">Newest first</option>
        <option value="name">Name (A–Z)</option>
        <option value="size">Size (largest first)</option>
      </select>

      <button id="new-button">+ New</button>
      <input type="file" id="file-input" hidden>

      <span id="user-label"></span>
      <button id="logout-button" type="button">Logout</button>
    </header>

    <div class="main-layout">
      <aside class="sidebar">
        <button class="nav-item active">My Drive</button>
        <button class="nav-item">Recent</button>
        <button class="nav-item">Starred</button>
        <button class="nav-item">Trash</button>
      </aside>

      <main class="content">
        <h1>My Drive</h1>
        <div class="file-area" id="file-area">
          <p>Your files will appear here.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- File Preview Modal -->
  <div id="preview-modal" class="preview-modal" hidden>
    <div class="preview-content">
      <div class="preview-header">
        <h2 id="preview-title">File Preview</h2>
        <button id="close-preview" type="button">Close</button>
      </div>

      <div id="preview-body" class="preview-body"></div>
    </div>
  </div>

</body>
</html>
